{% extends 'base.html' %}

{% block title %}Start Session — CodeHelp{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h1 class="h3 mb-4">Start a Problem Session</h1>

                    <form method="POST">
                        <select 
                            name="platform" 
                            id="platform" 
                            class="form-select mb-3"
                            required 
                            onchange="updateProblemInput()"
                        >
                            <option value="" disabled selected>Select platform</option>
                            <option value="leetcode">LeetCode</option>
                            <option value="codeforces">Codeforces</option>
                            <option value="other">Other / Manual</option>
                        </select>

                        <div id="leetcode-input" style="display:none;" class="mb-3">
                            <input
                                type="text"
                                name="lc_identifier"
                                id="lc_identifier"
                                class="form-control"
                                placeholder="Problem number (e.g. 1) or slug (e.g. two-sum)"
                            />
                        </div>

                        <!-- Codeforces input -->
                        <div id="codeforces-input" style="display:none;">
                            <div class="mb-3">
                                <label for="codeforces_problem" class="form-label">
                                    Codeforces Problem
                                </label>

                                <input
                                    type="text"
                                    name="codeforces_problem"
                                    id="codeforces_problem"
                                    class="form-control"
                                    placeholder="Problem URL or ID (e.g. 1900/A)"
                                >

                                <div class="form-text">
                                    Enter a Codeforces problem URL or contest/index such as
                                    1900/A.
                                </div>
                            </div>
                        </div>

                        <!-- Other / Manual input -->
                        <div id="manual-input" style="display:none;">
                            <div class="d-flex align-items-center gap-2 mb-2">
                                <input
                                    type="text"
                                    name="title_slug"
                                    id="title_slug"
                                    class="form-control"
                                    placeholder="Problem slug"
                                >

                                <span
                                    data-bs-toggle="tooltip"
                                    data-bs-placement="right"
                                    title="Use a unique slug to identify your problem."
                                >
                                    ℹ️
                                </span>
                            </div>

                            <input
                                type="text"
                                name="problem_title"
                                id="problem_title"
                                class="form-control mb-2"
                                placeholder="Problem title"
                            />

                            <div class="mb-3">
                                <label for="difficulty" class="form-label">
                                    Difficulty
                                </label>

                                <select
                                    name="difficulty"
                                    id="difficulty"
                                    class="form-select"
                                >
                                    <option value="" selected disabled>
                                        Select difficulty
                                    </option>
                                    <option value="Easy">Easy</option>
                                    <option value="Medium">Medium</option>
                                    <option value="Hard">Hard</option>
                                </select>
                            </div>
                        </div>

                        <div id="additional-problem-details" style="display:none;">
                            <div class="mb-3">
                                <label for="problem_statement" class="form-label">
                                    Problem Statement
                                </label>

                                <textarea
                                    name="problem_statement"
                                    id="problem_statement"
                                    class="form-control"
                                    placeholder="Paste the full problem statement here"
                                    rows="6"
                                ></textarea>

                                <div class="form-text">
                                    Required when adding a new problem.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Examples <span class="text-body-secondary">(optional)</span>
                                </label>

                                <div id="examples-container"></div>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary btn-sm"
                                    onclick="addExample()"
                                >
                                    + Add Example
                                </button>
                            </div>

                            <div class="mb-3">
                                <label class="form-label mb-2">
                                    Constraints
                                </label>

                                <div id="constraints-container"></div>

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary btn-sm mb-3"
                                    onclick="addConstraint()"
                                >
                                    + Add constraint
                                </button>
                            </div>
                        </div>

                        <button 
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Start Session
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function updateProblemInput() {
    const platform = document.getElementById('platform').value;

    const lcInput = document.getElementById('leetcode-input');
    const codeforcesInput = document.getElementById('codeforces-input');
    const manualInput = document.getElementById('manual-input');

    const lcIdentifier = document.getElementById('lc_identifier');
    const codeforcesProblem = document.getElementById('codeforces_problem');
    const titleSlug = document.getElementById('title_slug');

    const additionalDetails = document.getElementById('additional-problem-details');

    // Hide everything first
    lcInput.style.display = 'none';
    codeforcesInput.style.display = 'none';
    manualInput.style.display = 'none';
    additionalDetails.style.display = 'none';

    // Remove required validation from hidden fields
    lcIdentifier.required = false;
    codeforcesProblem.required = false;
    titleSlug.required = false;

    if (platform === 'leetcode') {
        lcInput.style.display = 'block';
        lcIdentifier.required = true;

    } else if (platform === 'codeforces') {
        codeforcesInput.style.display = 'block';
        codeforcesProblem.required = true;
        additionalDetails.style.display = 'block';

    } else if (platform === 'other') {
        manualInput.style.display = 'block';
        titleSlug.required = true;
        additionalDetails.style.display = 'block';
    }
}

function addConstraint() {
    const container = document.getElementById('constraints-container');
    const row = document.createElement('div');
    row.className = 'constraint-row d-flex gap-2 mb-2';

    const input = document.createElement('input');
    input.type = 'text';
    input.name = 'constraints';
    input.className = 'form-control';
    input.placeholder = 'Enter a constraint';

    const removeButton = document.createElement('button');
    removeButton.type = 'button';
    removeButton.className = 'btn btn-outline-danger btn-sm';
    removeButton.textContent = 'Remove';
    removeButton.onclick = function () {
        removeConstraint(this);
    }

    row.appendChild(input);
    row.appendChild(removeButton);

    container.appendChild(row)
}

function removeConstraint(button) {
    const row = button.parentElement;
    row.remove();
}

function addExample() {
    const container = document.getElementById('examples-container');

    const row = document.createElement('div');
    row.className = 'example-row border rounded p-3 mb-2';

    row.innerHTML = `
        <div class="mb-2">
            <label class="form-label">Input</label>
            <textarea
                name="example_input"
                class="form-control"
                rows="1"
                placeholder="Enter example input"
            ></textarea>
        </div>

        <div class="mb-2">
            <label class="form-label">Output</label>
            <textarea
                name="example_output"
                class="form-control"
                rows="1"
                placeholder="Enter example output"
            ></textarea>
        </div>

        <button
            type="button"
            class="btn btn-outline-danger btn-sm"
            onclick="removeExample(this)"
        >
            Remove
        </button>
    `;

    container.appendChild(row);
}

function removeExample(button) {
    const row = button.parentElement;
    row.remove();
}

const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
[...tooltipTriggerList].map(
    tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl)
);

</script>
{% endblock %}
